name: Release

on:
  push:
    tags:
      - 'v*'
      - '*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: List build artifacts
        run: |
          echo "Individual build files to be attached to release:"
          ls -lh dist/angular-15-mockapi-simple

      - name: Create GitHub Release and Upload Build Files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.event.release.tag_name || github.ref_name }}
          name: ${{ github.event.release.name || (github.event.inputs.tag_name && format('Release {0}', github.event.inputs.tag_name)) || format('Release {0}', github.ref_name) }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/angular-15-mockapi-simple/*
